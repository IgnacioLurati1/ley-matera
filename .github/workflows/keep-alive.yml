# Supabase pausa los proyectos gratuitos tras ~7 días sin actividad.
# Esta tarea hace una consulta mínima cada 3 días para mantenerlo despierto.
# Requiere las variables de repo SUPABASE_URL y SUPABASE_KEY (publishable key).
name: Mantener Supabase activo
on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "${{ vars.SUPABASE_URL }}/rest/v1/settings?select=key&limit=1" \
            -H "apikey: ${{ vars.SUPABASE_KEY }}" > /dev/null
