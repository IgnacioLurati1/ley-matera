# Publica el sitio en GitHub Pages en cada push a prod_frontend.
# Requiere las variables de repo VITE_SUPABASE_URL y VITE_SUPABASE_KEY (publishable key).
# Opcional: GOOGLE_SITE_VERIFICATION (código de Search Console, método "etiqueta HTML").
name: Publicar en GitHub Pages
on:
  push:
    branches: [prod_frontend]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Con dominio propio (variable SITE_DOMAIN, ej. leymatera.com.ar) el sitio vive en la raíz.
          BASE_PATH: ${{ vars.SITE_DOMAIN && '/' || format('/{0}/', github.event.repository.name) }}
          SITE_URL: ${{ vars.SITE_DOMAIN && format('https://{0}', vars.SITE_DOMAIN) || format('https://ignaciolurati1.github.io/{0}', github.event.repository.name) }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ vars.VITE_SUPABASE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
